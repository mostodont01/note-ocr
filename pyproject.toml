[project]
name = "notocr"
version = "0.1.0"
description = "Open-source optical music recognition: sheet music to MusicXML / MuseScore"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pillow",
    "torch",
    "svgelements",
    "cairosvg",
]

[project.scripts]
notocr = "notocr.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notocr"]

# CPU-only PyTorch (the laptop has no CUDA GPU); avoids multi-GB CUDA wheels.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
